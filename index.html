<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あの日</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  color:white;
  min-height:100vh;
  background:linear-gradient(#20172d,#63384d 48%,#f0a06b 73%,#182436);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 72% 22%,rgba(255,219,150,.9),transparent 9%),
    linear-gradient(transparent 66%,rgba(12,18,28,.92) 67%);
  z-index:-3;
}
body:after{
  content:"";
  position:fixed;
  left:50%;
  bottom:17%;
  width:38px;
  height:115px;
  background:rgba(8,8,13,.75);
  border-radius:24px 24px 8px 8px;
  box-shadow:-13px -32px 0 -8px rgba(8,8,13,.8);
  transform:translateX(-50%);
  z-index:-2;
}
.app{
  max-width:500px;
  min-height:100vh;
  margin:0 auto;
  padding:18px;
  background:rgba(18,14,26,.42);
  backdrop-filter:blur(16px);
}
.logo{font-size:38px;font-weight:900;letter-spacing:.09em;margin-top:26px}
.sub{color:rgba(255,255,255,.78);line-height:1.7;font-size:14px;margin:8px 0 18px}
.hero,.box,.card,.ad{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.22);
  border-radius:24px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 14px 40px rgba(0,0,0,.28);
}
.hero b{font-size:15px}
.hero p{font-size:13px;line-height:1.6;color:rgba(255,255,255,.82)}
textarea,input,select{
  width:100%;
  border:0;
  outline:0;
  border-radius:16px;
  padding:13px;
  font-size:16px;
  margin-top:10px;
}
textarea{min-height:120px;resize:none}
button{
  border:0;
  border-radius:999px;
  padding:11px 13px;
  font-weight:800;
}
.postBtn{
  width:100%;
  margin-top:10px;
  background:linear-gradient(135deg,#ffd08a,#ff8fab);
  color:#28131c;
  font-size:15px;
}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;background:rgba(255,255,255,.16);color:white}
.tabs .active{background:white;color:#241824}
.tag,.name{
  display:inline-block;
  font-size:12px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  margin-right:6px;
}
.text{white-space:pre-wrap;line-height:1.75;font-size:15px;margin-top:10px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;background:rgba(255,255,255,.18);color:white;font-size:13px}
.commentArea{margin-top:14px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.comment{font-size:13px;background:rgba(0,0,0,.22);padding:9px 11px;border-radius:14px;margin-top:8px;line-height:1.5}
.commentRow{display:flex;gap:8px}
.commentRow button{margin-top:10px;background:white;color:#251525}
.ad{
  text-align:center;
  color:rgba(255,255,255,.75);
  font-size:13px;
  border-style:dashed;
}
.empty{text-align:center;color:rgba(255,255,255,.7);padding:25px 0}
.small{font-size:12px;color:rgba(255,255,255,.55);margin-top:8px}
@media(min-width:760px){
  body{padding:30px 0}
  .app{border-radius:34px;min-height:90vh;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}
</style>
</head>
<body>
<main class="app">
  <div class="logo">あの日</div>
  <div class="sub">言えなかったごめん。戻れない後悔。ここにだけ、置いていく。</div>

  <section class="hero">
    <b>今日のお題：あの時、謝れなかったこと</b>
    <p>匿名で吐き出せる場所。読んだ人は「許す」「わかる」で少しだけ救える。</p>
  </section>

  <section class="box">
    <textarea id="postText" placeholder="あの日、言えなかったことを書く..."></textarea>
    <select id="category">
      <option>謝罪</option>
      <option>後悔</option>
      <option>恋愛</option>
      <option>家族</option>
      <option>友達</option>
      <option>仕事</option>
      <option>黒歴史</option>
    </select>
    <button class="postBtn" onclick="addPost()">匿名で投稿する</button>
    <div class="small">※今はこの端末内に保存されます。本格SNS化で全員共有にできます。</div>
  </section>

  <div class="ad">
    広告枠<br>
    ここに将来 AdSense / 占い / マッチング / 相談系広告を入れる
  </div>

  <div class="tabs">
    <button id="latestBtn" class="active" onclick="setMode('latest')">新着</button>
    <button id="popularBtn" onclick="setMode('popular')">人気</button>
  </div>

  <section id="posts"></section>
</main>

<script>
let posts = JSON.parse(localStorage.getItem("anohi_posts") || "[]");
let mode = "latest";

const names = ["名無しの後悔","夜明け待ち","あの日の人","言えなかった人","夕暮れの匿名"];

function save(){
  localStorage.setItem("anohi_posts", JSON.stringify(posts));
}

function addPost(){
  const text = document.getElementById("postText").value.trim();
  const category = document.getElementById("category").value;
  if(!text) return;

  posts.unshift({
    id: Date.now(),
    name: names[Math.floor(Math.random()*names.length)],
    text,
    category,
    like:0,
    forgive:0,
    understand:0,
    comments:[],
    created: new Date().toLocaleString("ja-JP")
  });

  document.getElementById("postText").value="";
  save();
  render();
}

function react(i,type){
  posts[i][type]++;
  save();
  render();
}

function addComment(i){
  const input=document.getElementById("comment-"+posts[i].id);
  const text=input.value.trim();
  if(!text) return;
  posts[i].comments.push(text);
  save();
  render();
}

function setMode(m){
  mode=m;
  document.getElementById("latestBtn").className=m==="latest"?"active":"";
  document.getElementById("popularBtn").className=m==="popular"?"active":"";
  render();
}

function score(p){
  return p.like + p.forgive*2 + p.understand + p.comments.length*2;
}

function render(){
  const area=document.getElementById("posts");
  if(posts.length===0){
    area.innerHTML='<div class="empty">まだ投稿はありません。</div>';
    return;
  }

  let list=[...posts];
  if(mode==="popular") list.sort((a,b)=>score(b)-score(a));

  area.innerHTML=list.map((p)=>{
    const i=posts.findIndex(x=>x.id===p.id);
    return `
    <article class="card">
      <span class="name">${safe(p.name)}</span>
      <span class="tag">${safe(p.category)}</span>
      <div class="small">${safe(p.created)}</div>
      <div class="text">${safe(p.text)}</div>

      <div class="actions">
        <button onclick="react(${i},'like')">♡ ${p.like}</button>
        <button onclick="react(${i},'forgive')">🤝 許す ${p.forgive}</button>
        <button onclick="react(${i},'understand')">💛 わかる ${p.understand}</button>
      </div>

      <div class="commentArea">
        ${p.comments.map(c=>`<div class="comment">${safe(c)}</div>`).join("")}
        <div class="commentRow">
          <input id="comment-${p.id}" placeholder="やさしいコメントを書く">
          <button onclick="addComment(${i})">送信</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

function safe(str){
  return String(str).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

render();
</script>
</body>
</html>
