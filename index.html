<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人生ガチャ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,210,120,.18),transparent 35%),
    linear-gradient(180deg,#050505,#101010 55%,#050505);
  color:#fff;
}
.app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  padding:22px;
}
.hero{
  padding:70px 0 34px;
  text-align:center;
}
.badge{
  display:inline-block;
  padding:7px 13px;
  border:1px solid rgba(255,215,120,.35);
  border-radius:999px;
  color:#ffd978;
  font-size:12px;
  margin-bottom:18px;
}
h1{
  font-size:46px;
  margin:0;
  letter-spacing:.08em;
}
.lead{
  color:rgba(255,255,255,.7);
  line-height:1.8;
  margin:18px 0 28px;
}
.card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}
button{
  width:100%;
  border:0;
  border-radius:999px;
  padding:16px;
  font-size:16px;
  font-weight:900;
  color:#080808;
  background:linear-gradient(135deg,#ffe08a,#c8942e);
}
button.secondary{
  margin-top:10px;
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1px solid rgba(255,255,255,.16);
}
.life-title{
  color:#ffd978;
  font-size:13px;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.item{
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:13px;
}
.label{
  color:rgba(255,255,255,.45);
  font-size:11px;
}
.value{
  margin-top:5px;
  font-weight:800;
}
.event{
  font-size:20px;
  line-height:1.7;
  font-weight:800;
}
.choice{
  margin-top:10px;
}
.result{
  line-height:1.8;
  color:rgba(255,255,255,.86);
}
.score{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:14px;
}
.score div{
  flex:1;
  text-align:center;
  background:rgba(255,255,255,.08);
  border-radius:16px;
  padding:12px 8px;
}
.score b{
  color:#ffd978;
  font-size:22px;
}
.hidden{display:none}
.small{
  color:rgba(255,255,255,.45);
  font-size:12px;
  line-height:1.6;
  text-align:center;
  margin-top:18px;
}
.footer{
  text-align:center;
  color:rgba(255,255,255,.35);
  font-size:12px;
  margin:30px 0 10px;
}
@media(min-width:760px){
  body{padding:34px 0}
  .app{
    border-radius:34px;
    min-height:90vh;
    background:rgba(255,255,255,.03);
    box-shadow:0 40px 100px rgba(0,0,0,.55);
  }
}
</style>
</head>
<body>
<main class="app">

  <section id="top" class="hero">
    <div class="badge">AI LIFE SIMULATOR</div>
    <h1>人生ガチャ</h1>
    <p class="lead">
      あなたは、別の人生を引けます。<br>
      金持ちか。貧乏か。成功か。後悔か。<br>
      すべては、最初の一回で決まる。
    </p>
    <button onclick="drawLife()">人生を引く</button>
    <p class="small">※まずは無料プロトタイプ版。何度でも引けます。</p>
  </section>

  <section id="lifeCard" class="card hidden">
    <div class="life-title">あなたの人生</div>
    <div class="grid" id="lifeGrid"></div>
    <button style="margin-top:16px" onclick="startLife()">人生を始める</button>
    <button class="secondary" onclick="drawLife()">引き直す</button>
  </section>

  <section id="eventCard" class="card hidden">
    <div class="life-title">人生イベント</div>
    <div class="event" id="eventText"></div>
    <div id="choices"></div>
  </section>

  <section id="resultCard" class="card hidden">
    <div class="life-title">選択の結果</div>
    <div class="result" id="resultText"></div>
    <div class="score">
      <div>幸福<br><b id="happy">0</b></div>
      <div>金<br><b id="money">0</b></div>
      <div>後悔<br><b id="regret">0</b></div>
    </div>
    <button style="margin-top:16px" onclick="nextEvent()">次のイベントへ</button>
    <button class="secondary" onclick="resetAll()">最初から</button>
  </section>

  <div class="footer">人生は、選べない。だけど、覗くことはできる。</div>
</main>

<script>
const profiles = [
  ["17歳","男性","沖縄県","高校生","年収0円","彼女なし","貯金2万円"],
  ["24歳","女性","東京都","美容師","年収310万円","恋人あり","貯金40万円"],
  ["31歳","男性","山形県","工場営業","年収520万円","妻あり・子供2人","貯金700万円"],
  ["38歳","女性","福岡県","看護師","年収460万円","独身","貯金180万円"],
  ["45歳","男性","大阪府","飲食店オーナー","年収900万円","離婚歴あり","借金400万円"],
  ["29歳","女性","北海道","無職","年収0円","恋人なし","貯金8万円"],
  ["52歳","男性","神奈川県","会社役員","年収2400万円","家庭あり","貯金6000万円"],
  ["21歳","男性","愛知県","大学生","年収80万円","片思い中","貯金15万円"]
];

const events = [
  {
    text:"大切な人から深夜に電話が来ました。明日は人生を変える面接です。どうしますか？",
    choices:[
      ["電話に出る","あなたは信頼を失わずに済みました。しかし睡眠不足で面接は少し失敗しました。",8,-2,1],
      ["寝る","面接は完璧でした。でもその人との距離は、少しだけ戻らなくなりました。",-3,8,6]
    ]
  },
  {
    text:"怪しいけど大きく稼げそうな話が来ました。友達は『今しかない』と言っています。",
    choices:[
      ["乗る","一時的に大金を手にしました。しかし不安とトラブルも増えました。",-5,10,8],
      ["断る","お金は増えません。でもあなたは静かな夜を守りました。",5,0,1]
    ]
  },
  {
    text:"昔好きだった人から連絡が来ました。今の生活は安定しています。",
    choices:[
      ["会う","胸は高鳴りました。でも今の生活に小さなヒビが入りました。",2,-1,8],
      ["会わない","何も起きませんでした。でもその夜、少しだけ別の人生を想像しました。",4,0,3]
    ]
  },
  {
    text:"会社で理不尽な上司に怒鳴られました。周りは黙っています。",
    choices:[
      ["言い返す","空気は凍りました。でもあなたを見る目が少し変わりました。",3,-3,2],
      ["黙る","その日は無事に終わりました。でも心の中に何かが残りました。",-3,2,6]
    ]
  },
  {
    text:"家族が助けを求めています。でもあなた自身も限界です。",
    choices:[
      ["助ける","誰かは救えました。でもあなたの心はかなり削れました。",5,-4,2],
      ["距離を置く","あなたは自分を守りました。でも罪悪感は残りました。",1,1,7]
    ]
  }
];

let currentLife = null;
let currentEvent = null;
let score = {happy:0,money:0,regret:0};

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function drawLife(){
  currentLife = pick(profiles);
  score = {happy:0,money:0,regret:0};

  document.getElementById("top").classList.add("hidden");
  document.getElementById("eventCard").classList.add("hidden");
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("lifeCard").classList.remove("hidden");

  const labels=["年齢","性別","場所","職業","収入","状況","資産"];
  document.getElementById("lifeGrid").innerHTML = currentLife.map((v,i)=>`
    <div class="item">
      <div class="label">${labels[i]}</div>
      <div class="value">${v}</div>
    </div>
  `).join("");
}

function startLife(){
  document.getElementById("lifeCard").classList.add("hidden");
  nextEvent();
}

function nextEvent(){
  currentEvent = pick(events);
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("eventCard").classList.remove("hidden");

  document.getElementById("eventText").textContent = currentEvent.text;
  document.getElementById("choices").innerHTML = currentEvent.choices.map((c,i)=>`
    <button class="choice" onclick="choose(${i})">${c[0]}</button>
  `).join("");
}

function choose(i){
  const c = currentEvent.choices[i];
  score.happy += c[2];
  score.money += c[3];
  score.regret += c[4];

  document.getElementById("eventCard").classList.add("hidden");
  document.getElementById("resultCard").classList.remove("hidden");

  document.getElementById("resultText").textContent = c[1];
  document.getElementById("happy").textContent = score.happy;
  document.getElementById("money").textContent = score.money;
  document.getElementById("regret").textContent = score.regret;
}

function resetAll(){
  document.getElementById("top").classList.remove("hidden");
  document.getElementById("lifeCard").classList.add("hidden");
  document.getElementById("eventCard").classList.add("hidden");
  document.getElementById("resultCard").classList.add("hidden");
}
</script>
</body>
</html>
